<head>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
<link href='style.css' rel='stylesheet' type='text/css'>
<title>TGDValues Results</title>
<link rel="icon" type="x-icon" href="icon.png">
<link rel="shortcut icon" type="x-icon" href="icon.png">
<meta charset="utf-8">
<script>
  version = "Test Edition #1" //Remember to update this before making changes to the test itself!
</script>
</head>
<script type="application/javascript"
        src="ideologies.js">
</script>

<body>
<h1>TGDValues</h1>
<hr>

<h1>Results</h1>

<h2>Focus Axis: <span class="weight-300" id="focus-label"></span></h2>
<div class="axis">
    <img id="img-mainplot" src="value_images/mainplot.svg" height="128pt"/>
    <div class="bar mainplot" id="bar-mainplot"><div class="text-wrapper" id="mainplot"></div></div>
    <div class="bar ventures" id="bar-ventures"><div class="text-wrapper" id="ventures"></div></div>
    <img id="img-ventures" src="value_images/ventures.svg" height="128pt"/>
</div>
<h2>Diplomatic Axis: <span class="weight-300" id="diplomatic-label"></span></h2>
<div class="axis">
    <img id="img-tgdist" src="value_images/tgdist.svg" height="128pt"/>
    <div class="bar tgdist" id="bar-tgdist"><div class="text-wrapper" id="tgdist"></div></div>
    <div class="bar globalist" id="bar-globalist"><div class="text-wrapper" id="globalist"></div></div>
    <img id="img-globalist" src="value_images/globalist.svg" height="128pt"/>
</div>
<h2>Civil Axis: <span class="weight-300" id="civil-label"></span></h2>
<div class="axis">
    <img id="img-liberty" src="value_images/liberty.svg" height="128pt"/>
    <div class="bar liberty" id="bar-liberty"><div class="text-wrapper" id="liberty"></div></div>
    <div class="bar moderation" id="bar-moderation"><div class="text-wrapper" id="moderation"></div></div>
    <img id="img-moderation" src="value_images/moderation.svg" height="128pt"/>
</div>
<h2>Generation Axis: <span class="weight-300" id="generation-label"></span></h2>
<div class="axis">
    <img id="img-oldgen" src="value_images/oldgen.svg" height="128pt"/>
    <div class="bar oldgen" id="bar-oldgen"><div class="text-wrapper" id="oldgen"></div></div>
    <div class="bar newgen" id="bar-newgen"><div class="text-wrapper" id="newgen"></div></div>
    <img id="img-newgen" src="value_images/newgen.svg" height="128pt"/>
</div>
<h2>Closest Match: <span class="weight-300" id="ideology-label"></span></h2>
<p>Ideological matching is a work in progress, and is much less accurate than the values and axes.</p>
<p>Send your results in the discord server! It'd be cool to see them</p>
<hr/>
<img src="" id="banner">
<button class="button" onclick="location.href='index.html';">Back</button> <br>
<!-- Website visit statistics - no personal information is collected! -->
<script type="text/javascript">
var sc_project=11325211;
var sc_invisible=1;
var sc_security="fd9f0659";
var scJsHost = (("https:" == document.location.protocol) ?
"https://secure." : "http://www.");
document.write("<sc"+"ript type='text/javascript' src='" +
scJsHost+
"statcounter.com/counter/counter.js'></"+"script>");
</script>
<noscript><div class="statcounter"><a title="web stats"
href="http://statcounter.com/" target="_blank"><img
class="statcounter"
src="//c.statcounter.com/11325211/0/fd9f0659/1/" alt="web
stats"></a></div></noscript>
<script>
    function getQueryVariable(variable)
    {
           var query = window.location.search.substring(1)
           var vars = query.split("&")
           for (var i=0;i<vars.length;i++) {
                   var pair = vars[i].split("=")
                   if(pair[0] == variable) {return pair[1]}
           }
           return(NaN);
    }

    function setBarValue(name, value) {
        innerel = document.getElementById(name)
        outerel = document.getElementById("bar-" + name)
        outerel.style.width = (value + "%")
        innerel.innerHTML = (value + "%")
        if (innerel.offsetWidth + 20 > outerel.offsetWidth) {
            innerel.style.visibility = "hidden"
        }
    }

    focusArray = ["Extreme Mainplot","Strong Mainplot","Mainplot","Balanced","Ventures","Strong Ventures","Extreme Ventures"]
    diplomaticArray = ["Extreme Globalist","Strong Globalist","Globalist","Balanced","TGDist","Strong TGDist","Extreme TGDist"]
    civilArray = ["Extreme Liberty","Strong Liberty","Liberty","Balanced","Moderation","Strong Moderation","Extreme Moderation"]
    generationArray = ["Extreme Newgen","Strong Newgen","Newgen","Balanced","Oldgen","Strong Oldgen","Extreme Oldgen"]

    function setLabel(val,ary) {
        if (val > 100) { return "" } else
        if (val > 90) { return ary[0] } else
        if (val > 75) { return ary[1] } else
        if (val > 60) { return ary[2] } else
        if (val >= 40) { return ary[3] } else
        if (val >= 25) { return ary[4] } else
        if (val >= 10) { return ary[5] } else
        if (val >= 0) { return ary[6] } else
        	{return ""}
    }

    mainplot  = getQueryVariable("e")
    globalist     = getQueryVariable("d")
    liberty   = getQueryVariable("g")
    newgen  = getQueryVariable("s")
    ventures    = (100 - mainplot).toFixed(1)
    tgdist     = (100 - globalist   ).toFixed(1)
    moderation = (100 - liberty ).toFixed(1)
    oldgen = (100 - newgen).toFixed(1)

    setBarValue("mainplot", mainplot)
    setBarValue("ventures", ventures)
    setBarValue("globalist", globalist)
    setBarValue("tgdist", tgdist)
    setBarValue("liberty", liberty)
    setBarValue("moderation", moderation)
    setBarValue("newgen", newgen)
    setBarValue("oldgen", oldgen)

    document.getElementById("focus-label").innerHTML = setLabel(mainplot, focusArray)
    document.getElementById("diplomatic-label").innerHTML = setLabel(globalist, diplomaticArray)
    document.getElementById("civil-label").innerHTML = setLabel(liberty, civilArray)
    document.getElementById("generation-label").innerHTML = setLabel(newgen, generationArray)

    ideology = ""
    ideodist = Infinity
    for (var i = 0; i < ideologies.length; i++) {
        dist = 0
        dist += Math.pow(Math.abs(ideologies[i].stats.mainplot - mainplot), 2)
        dist += Math.pow(Math.abs(ideologies[i].stats.liberty - liberty), 2)
        dist += Math.pow(Math.abs(ideologies[i].stats.globalist - globalist), 1.73856063)
        dist += Math.pow(Math.abs(ideologies[i].stats.newgen - newgen), 1.73856063)
        if (dist < ideodist) {
            ideology = ideologies[i].name
            ideodist = dist
        }
    }
    document.getElementById("ideology-label").innerHTML = ideology

    function createImage(src, x, y, w, h) {
        img = new Image ()
        img.src = src
        img.onLoad = function() {
            ctx.drawImage(img, x, y, w, h)
        }
    }

    window.onload = function() {
        var c = document.createElement("canvas")
        var ctx = c.getContext("2d")
        c.width = 800;
        c.height = 650;
        ctx.fillStyle = "#EEEEEE"
        ctx.fillRect(0,0,800,650);

        img = document.getElementById("img-mainplot")
        ctx.drawImage(img, 20, 170, 100, 100);
        img = document.getElementById("img-ventures")
        ctx.drawImage(img, 680, 170, 100, 100)
        img = document.getElementById("img-tgdist")
        ctx.drawImage(img, 20, 290, 100, 100)
        img = document.getElementById("img-globalist")
        ctx.drawImage(img, 680, 290, 100, 100)
        img = document.getElementById("img-liberty")
        ctx.drawImage(img, 20, 410, 100, 100)
        img = document.getElementById("img-moderation")
        ctx.drawImage(img, 680, 410, 100, 100)
        img = document.getElementById("img-oldgen")
        ctx.drawImage(img, 20, 530, 100, 100)
        img = document.getElementById("img-newgen")
        ctx.drawImage(img, 680, 530, 100, 100)

        ctx.fillStyle="#222222"
        ctx.fillRect(120, 180, 560, 80)
        ctx.fillRect(120, 300, 560, 80)
        ctx.fillRect(120, 420, 560, 80)
        ctx.fillRect(120, 540, 560, 80)
        ctx.fillStyle="#f44336"
        ctx.fillRect(120, 184, 5.6*mainplot-2, 72)
        ctx.fillStyle="#00897b"
        ctx.fillRect(682-5.6*ventures, 184, 5.6*ventures-2, 72)
        ctx.fillStyle="#ff9800"
        ctx.fillRect(120, 304, 5.6*tgdist-2, 72)
        ctx.fillStyle="#03a9f4"
        ctx.fillRect(682-5.6*globalist, 304, 5.6*globalist-2, 72)
        ctx.fillStyle="#ffeb3b"
        ctx.fillRect(120, 424, 5.6*liberty-2, 72)
        ctx.fillStyle="#3f51b5"
        ctx.fillRect(682-5.6*moderation, 424, 5.6*moderation-2, 72)
        ctx.fillStyle="#8bc34a"
        ctx.fillRect(120, 544, 5.6*oldgen-2, 72)
        ctx.fillStyle="#9c27b0"
        ctx.fillRect(682-5.6*newgen, 544, 5.6*newgen-2, 72)
        ctx.fillStyle="#222222"
        ctx.font="700 80px Montserrat"
        ctx.textAlign="left"
        ctx.fillText("TGDValues", 20, 90)
        ctx.font="50px Montserrat"
        ctx.fillText(ideology, 20, 140)

        ctx.textAlign="left"
        if (mainplot  > 30) {ctx.fillText(mainplot + "%", 130, 237.5)}
        if (tgdist     > 30) {ctx.fillText(tgdist + "%", 130, 357.5)}
        if (liberty   > 30) {ctx.fillText(liberty + "%", 130, 477.5)}
        if (oldgen > 30) {ctx.fillText(oldgen + "%", 130, 597.5)}
        ctx.textAlign="right"
        if (ventures    > 30) {ctx.fillText(ventures + "%", 670, 237.5)}
        if (globalist     > 30) {ctx.fillText(globalist + "%", 670, 357.5)}
        if (moderation > 30) {ctx.fillText(moderation + "%", 670, 477.5)}
        if (newgen  > 30) {ctx.fillText(newgen + "%", 670, 597.5)}

        ctx.font="300 26px Montserrat"
        ctx.fillText("tgdvalues.geography.gg", 780, 45)
        ctx.fillText("discord.gg/geography", 780, 75)
        ctx.fillText(version, 780, 105)
        ctx.font="300 30px Montserrat"
        ctx.textAlign="center"
        ctx.fillText("Focus Axis: " + document.getElementById("focus-label").innerHTML, 400, 175)
        ctx.fillText("Diplomatic Axis: " + document.getElementById("diplomatic-label").innerHTML, 400, 295)
        ctx.fillText("Civil Axis: " + document.getElementById("civil-label").innerHTML, 400, 415)
        ctx.fillText("Generation Axis: " + document.getElementById("generation-label").innerHTML, 400, 535)

        document.getElementById("banner").src = c.toDataURL();
    }
    </script>
</body>
